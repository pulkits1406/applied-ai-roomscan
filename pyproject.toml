[project]
name = "zingly-scan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "open3d>=0.20.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
ml = [
    "moge",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roomscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "b942f00bdc2a" }
