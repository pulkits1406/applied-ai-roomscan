[project]
name = "zingly-scan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "open3d>=0.20.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
]

[project.scripts]
roomscan-bench = "roomscan.bench.evaluate:main"
roomscan-lidar = "roomscan.lidar.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
ml = [
    "moge",
    "pycolmap>=4.2.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roomscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "b942f00bdc2a" }

[tool.uv]
default-groups = ["dev", "ml"]
